<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>학술연구교수 B 연구 진행표</title>
  <meta name="description" content="AI 기반 지능형 어드바이징 시스템 연구를 일정 안에 완성하기 위한 월별 실행 체크리스트">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231b3a57'/%3E%3Cpath d='M18 19h28v30H18z' fill='%23fff'/%3E%3Cpath d='m23 33 6 6 13-15' fill='none' stroke='%232db9a3' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root{--navy:#16324a;--ink:#17212b;--muted:#607080;--paper:#f5f8fa;--white:#fff;--mint:#25a995;--mint2:#dff5ef;--amber:#eea43b;--red:#d85858;--line:#dbe4e9;--shadow:0 14px 35px rgba(20,50,75,.09)}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.55}
    button{font:inherit} .wrap{max-width:1120px;margin:auto;padding:28px 22px 70px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.eyebrow{font-size:.82rem;font-weight:800;color:var(--mint);letter-spacing:.08em}h1{font-size:clamp(1.8rem,4vw,3.1rem);line-height:1.12;margin:.25rem 0 .5rem;letter-spacing:-.045em}.sub{color:var(--muted);margin:0}.controls{display:flex;flex-wrap:wrap;gap:9px;justify-content:flex-end}.btn{border:1px solid var(--line);background:var(--white);color:var(--navy);padding:10px 14px;border-radius:10px;font-weight:750;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.03)}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn:hover{transform:translateY(-1px)}
    .dashboard{display:grid;grid-template-columns:1.3fr .7fr;gap:16px;margin-bottom:18px}.card{background:var(--white);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.status{padding:22px}.status-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}.label{color:var(--muted);font-size:.9rem}.big{font-size:2.2rem;font-weight:850;color:var(--navy)}.bar{height:12px;background:#e8eff2;border-radius:99px;overflow:hidden;margin-top:14px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),#53c9b8);width:0;transition:.3s}.next{padding:22px;background:var(--navy);color:#fff}.next .label{color:#b8c8d6}.next strong{display:block;font-size:1.22rem;margin:6px 0}.next time{color:#8fe0d2;font-weight:750}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 12px}.toolbar h2{font-size:1.15rem;margin:0}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{border:0;background:#e5ecef;color:#536473;padding:7px 11px;border-radius:999px;font-weight:700;cursor:pointer}.filter.active{background:var(--navy);color:#fff}
    .timeline{position:relative}.phase{display:grid;grid-template-columns:170px 1fr;gap:18px;margin-bottom:13px}.phase-meta{padding:17px 8px 0 0;text-align:right}.phase-meta h3{font-size:1rem;margin:0;color:var(--navy)}.phase-meta span{font-size:.82rem;color:var(--muted)}.items{padding:8px}.item{display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:start;padding:14px;border-radius:12px}.item:hover{background:#f7fafb}.item+.item{border-top:1px solid #edf1f3}.check{width:22px;height:22px;accent-color:var(--mint);margin-top:3px}.item-title{font-weight:780}.item-desc{font-size:.88rem;color:var(--muted);margin-top:2px}.due{font-size:.84rem;font-weight:750;color:var(--navy);white-space:nowrap;padding:3px 8px;border-radius:8px;background:#eef4f6}.due.urgent{background:#fff0dc;color:#995b09}.due.overdue{background:#fde8e8;color:#a63434}.item.done .item-title{text-decoration:line-through;color:#84919b}.item.done .item-desc{opacity:.65}.empty{padding:40px;text-align:center;color:var(--muted);display:none}
    .notice{margin-top:18px;padding:16px 18px;display:flex;gap:11px;align-items:flex-start}.notice b{color:var(--navy)}.notice p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
    @media(max-width:760px){.top{display:block}.controls{justify-content:flex-start;margin-top:16px}.dashboard{grid-template-columns:1fr}.phase{grid-template-columns:1fr}.phase-meta{text-align:left;padding:18px 12px 0}.item{grid-template-columns:auto 1fr}.due{grid-column:2;justify-self:start}.wrap{padding:20px 14px 50px}}
  </style>
</head>
<body><main class="wrap">
  <header class="top"><div><div class="eyebrow">2026 학술연구교수 B유형</div><h1>연구 완성 일정표</h1><p class="sub">연구기간 2026. 6. 1. — 2027. 5. 31. · 후속 정산 2027. 8. 31.까지</p></div><div class="controls"><button class="btn" id="notify">알림 켜기</button><button class="btn" id="ics">캘린더 파일 받기</button><button class="btn primary" id="reset">완료 기록 초기화</button></div></header>
  <section class="dashboard"><div class="card status"><div class="status-row"><div><div class="label">전체 진행률</div><div class="big"><span id="pct">0</span>%</div></div><div class="label"><b id="done">0</b> / <span id="total">0</span> 완료</div></div><div class="bar"><i id="fill"></i></div></div><div class="card next"><div class="label">다음 핵심 일정</div><strong id="nextTitle">일정 확인 중</strong><time id="nextDate"></time></div></section>
  <div class="toolbar"><h2>시간대별 체크리스트</h2><div class="filters"><button class="filter active" data-filter="all">전체</button><button class="filter" data-filter="pending">할 일</button><button class="filter" data-filter="done">완료</button></div></div>
  <section class="timeline" id="timeline"></section><div class="card empty" id="empty">해당하는 항목이 없습니다.</div>
  <aside class="card notice"><span>ⓘ</span><div><b>알림 안내</b><p>브라우저 알림은 이 페이지가 열려 있을 때 마감 30일·14일·7일·1일 전에 표시됩니다. 실제 제출일은 한국연구재단 및 주관기관의 최신 안내를 우선하세요.</p></div></aside>
</main>
<script>
const phases=[
 {title:'기초연구 완료 확인',range:'2026년 6월—9월',items:[
  {id:'a1',title:'실행계획·문헌조사 자료 완료 확인',desc:'국내외 모듈형 교육과정, Advising Analytics 및 플랫폼 사례 자료의 누락을 확인합니다.',date:'2026-10-09'},
  {id:'a2',title:'IRB·설문·FGI 증빙 정리',desc:'승인자료, 최종 설문지, 응답 원자료, 인터뷰 기록과 동의서를 연구 폴더에 확정합니다.',date:'2026-10-12'},
  {id:'a3',title:'분석용 데이터셋 동결',desc:'결측·이상치 처리와 변수명을 확정하고 원본과 분석본을 분리 보관합니다.',date:'2026-10-14',key:true}]},
 {title:'요구분석 확정',range:'2026년 10월',items:[
  {id:'b1',title:'대응표본 t-검정 완료',desc:'필요수준과 현재수준의 차이, 효과크기와 유의확률을 결과표로 정리합니다.',date:'2026-10-20'},
  {id:'b2',title:'Borich 요구도 산출',desc:'문항별 요구도와 순위를 산출하고 분석식·코드·결과표를 함께 보관합니다.',date:'2026-10-23'},
  {id:'b3',title:'Locus for Focus 시각화',desc:'필요수준과 차이수준을 기준으로 사분면을 작성하고 HH 영역 항목을 확인합니다.',date:'2026-10-27'},
  {id:'b4',title:'핵심 기능 우선순위 확정',desc:'Borich 상위 항목과 LF의 HH 항목을 교차 검토해 최우선 설계요소를 문서화합니다.',date:'2026-10-30',key:true}]},
 {title:'중간점검·설계',range:'2026년 11월—12월',items:[
  {id:'c1',title:'중간 연구성과 보고서 작성',desc:'문헌·사례·요구분석 결과와 다음 단계 쟁점을 전문가 자문용 문서로 정리합니다.',date:'2026-11-10'},
  {id:'c2',title:'전문가 자문 및 수정사항 확정',desc:'설계요소의 적절성, 데이터 윤리, 구현 가능성을 검토받고 반영표를 만듭니다.',date:'2026-11-20',key:true},
  {id:'c3',title:'성찰 기반 어드바이징 알고리즘 설계',desc:'입력 데이터, 판단 규칙, AI 제안, 교수자 확인, 학습자 성찰의 순환 구조를 정의합니다.',date:'2026-12-11'},
  {id:'c4',title:'개념모형·서비스 플로차트 확정',desc:'교수자와 학습자별 이용 흐름, 예외 상황 및 인간-AI 협업 지점을 도식화합니다.',date:'2026-12-23',key:true}]},
 {title:'프로토타입 개발',range:'2027년 1월—2월',items:[
  {id:'d1',title:'화면·정보구조 설계',desc:'Kiro AI를 활용해 핵심 화면, 상담 이력, 추천 근거, 성찰 기록의 정보구조를 설계합니다.',date:'2027-01-12'},
  {id:'d2',title:'상호작용형 프로토타입 1차 완성',desc:'AI Studio에서 교수자·학습자 핵심 시나리오를 실행할 수 있는 버전을 완성합니다.',date:'2027-01-29',key:true},
  {id:'d3',title:'전문가 타당성 검토 완료',desc:'델파이 또는 전문가 평정을 실시하고 내용타당도와 수정 의견을 정리합니다.',date:'2027-02-12'},
  {id:'d4',title:'사용자 시나리오 검증·보완',desc:'대표 과업을 기준으로 화면 흐름, 용어, 추천 설명과 오류 대응을 수정합니다.',date:'2027-02-24'},
  {id:'d5',title:'검증 반영본 동결',desc:'3월 최종화에 사용할 기능·화면 범위를 확정하고 추가 기능 개발을 중단합니다.',date:'2027-02-26',key:true}]},
 {title:'최종 산출물 완성',range:'2027년 3월',items:[
  {id:'e1',title:'최종 프로토타입 확정',desc:'핵심 기능과 전체 시나리오를 점검하고 시연 가능한 안정 버전을 보관합니다.',date:'2027-03-12',key:true},
  {id:'e2',title:'시스템 활용 가이드 완성',desc:'사용자 역할, 화면별 이용방법, 데이터 처리와 인간 검토 원칙을 문서화합니다.',date:'2027-03-19'},
  {id:'e3',title:'연구보고서 초안 완성',desc:'연구목표·방법·결과·논의·활용방안과 국영문 요약을 포함한 전체 초안을 완성합니다.',date:'2027-03-26',key:true},
  {id:'e4',title:'내부 교정·누락 보완',desc:'계획서 대비 산출물, 표·그림, 참고문헌, 윤리 및 증빙자료의 누락을 점검합니다.',date:'2027-03-31'}]},
 {title:'성과 확산·제출',range:'2027년 4월—5월',items:[
  {id:'f1',title:'KCI급 학술지 투고본 확정',desc:'요구분석과 시스템 설계 결과를 논문 형식으로 정리하고 공저자·전문가 검토를 마칩니다.',date:'2027-04-09'},
  {id:'f2',title:'논문 투고 및 성과공유',desc:'KCI급 이상 학술지에 투고하고 대학 관계자 대상 발표 또는 특강 자료를 남깁니다.',date:'2027-04-16',key:true},
  {id:'f3',title:'학술활동 결과보고서 제출',desc:'공식 마감보다 여유 있게 보고서, 요약문, 프로토타입 및 성과 증빙을 제출합니다.',date:'2027-04-30',key:true},
  {id:'f4',title:'기관 승인·접수상태 확인',desc:'주관기관 승인과 최종 접수번호를 확인하고 제출 화면과 파일을 보관합니다.',date:'2027-05-07'},
  {id:'f5',title:'최종 보완 버퍼',desc:'반려·수정 요청, 형식 오류 또는 누락 자료를 처리할 수 있도록 2주 이상의 완충기간을 확보합니다.',date:'2027-05-21'},
  {id:'f6',title:'연구 종료·후속연구 계획 확정',desc:'최종 자료를 보관하고 실제 시스템 구현 및 효과성 검증으로 이어질 후속 계획을 작성합니다.',date:'2027-05-31',key:true}]},
 {title:'정산·사후관리',range:'2027년 6월—8월',items:[
  {id:'g1',title:'정산 요청자료 제출',desc:'산학협력단의 사용실적보고 및 증빙 요청에 대응합니다.',date:'2027-07-31'},
  {id:'g2',title:'연구비 사용실적보고 확인',desc:'통합이지바로 정산, 잔액·이자·반납 여부를 최종 확인합니다.',date:'2027-08-31',key:true}]}
];
const flat=phases.flatMap(p=>p.items), storeKey='nrf-b-2026-checks'; let state=JSON.parse(localStorage.getItem(storeKey)||'{}'), filter='all';
const fmt=d=>new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'short',day:'numeric'}).format(new Date(d+'T00:00:00+09:00'));
function dayDiff(d){return Math.ceil((new Date(d+'T23:59:59+09:00')-new Date())/86400000)}
function render(){const root=document.querySelector('#timeline');root.innerHTML='';let shown=0;phases.forEach(p=>{const its=p.items.filter(i=>filter==='all'||(filter==='done'&&state[i.id])||(filter==='pending'&&!state[i.id]));if(!its.length)return;shown+=its.length;const s=document.createElement('article');s.className='phase';s.innerHTML=`<div class="phase-meta"><h3>${p.title}</h3><span>${p.range}</span></div><div class="card items">${its.map(i=>{const dd=dayDiff(i.date);const cls=dd<0?'overdue':dd<=30?'urgent':'';return `<label class="item ${state[i.id]?'done':''}"><input class="check" type="checkbox" data-id="${i.id}" ${state[i.id]?'checked':''}><span><div class="item-title">${i.title}</div><div class="item-desc">${i.desc}</div></span><time class="due ${cls}">${fmt(i.date)}</time></label>`}).join('')}</div>`;root.appendChild(s)});document.querySelector('#empty').style.display=shown?'none':'block';root.querySelectorAll('.check').forEach(c=>c.onchange=()=>{state[c.dataset.id]=c.checked;localStorage.setItem(storeKey,JSON.stringify(state));render()});const done=flat.filter(i=>state[i.id]).length,pct=Math.round(done/flat.length*100);document.querySelector('#done').textContent=done;document.querySelector('#total').textContent=flat.length;document.querySelector('#pct').textContent=pct;document.querySelector('#fill').style.width=pct+'%';const next=flat.filter(i=>!state[i.id]&&dayDiff(i.date)>=0).sort((a,b)=>a.date.localeCompare(b.date))[0];document.querySelector('#nextTitle').textContent=next?next.title:'예정된 할 일을 모두 마쳤습니다';document.querySelector('#nextDate').textContent=next?`${fmt(next.date)} · D-${dayDiff(next.date)}`:'';
document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
document.querySelector('#reset').onclick=()=>{if(confirm('완료 기록을 모두 초기화할까요?')){state={};localStorage.removeItem(storeKey);render()}};
document.querySelector('#notify').onclick=async()=>{if(!('Notification'in window))return alert('이 브라우저는 알림을 지원하지 않습니다.');const p=await Notification.requestPermission();if(p==='granted'){new Notification('연구 진행표 알림이 켜졌습니다',{body:'마감이 가까워지면 이 페이지를 열었을 때 알려드릴게요.'});localStorage.setItem('nrf-notify','1')}else alert('브라우저에서 알림이 허용되지 않았습니다.')};
function checkAlerts(){if(Notification.permission!=='granted'||localStorage.getItem('nrf-notify')!=='1')return;const today=new Date().toISOString().slice(0,10);flat.forEach(i=>{const d=dayDiff(i.date),k=`alert-${i.id}-${d}`;if([30,14,7,1,0].includes(d)&&!localStorage.getItem(k)&&!state[i.id]){new Notification(`연구 일정 D-${d}: ${i.title}`,{body:`마감 ${fmt(i.date)} · 진행표에서 준비 상태를 확인하세요.`});localStorage.setItem(k,today)}})}
function esc(s){return s.replace(/,/g,'\\,').replace(/;/g,'\\;')};function icsDate(d){return d.replaceAll('-','')};
document.querySelector('#ics').onclick=()=>{const events=flat.filter(i=>i.key).map(i=>`BEGIN:VEVENT\r\nUID:${i.id}@nrf-checklist\r\nDTSTART;VALUE=DATE:${icsDate(i.date)}\r\nDTEND;VALUE=DATE:${icsDate(new Date(new Date(i.date+'T00:00:00+09:00').getTime()+86400000).toISOString().slice(0,10))}\r\nSUMMARY:${esc('[학술연구교수 B] '+i.title)}\r\nDESCRIPTION:${esc(i.desc)}\r\nBEGIN:VALARM\r\nTRIGGER:-P7D\r\nACTION:DISPLAY\r\nDESCRIPTION:일주일 전 알림\r\nEND:VALARM\r\nEND:VEVENT`).join('\r\n');const blob=new Blob([`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//NRF Checklist//KO\r\nCALSCALE:GREGORIAN\r\n${events}\r\nEND:VCALENDAR`],{type:'text/calendar'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='학술연구교수B_핵심일정.ics';a.click();URL.revokeObjectURL(a.href)};
render();checkAlerts();
</script></body></html>
